spring.application.name=lanterne
# Les erreurs au format standard (RFC 9457, ProblemDetail).
spring.mvc.problemdetails.enabled=true
# Le fournisseur du modèle (compatible OpenAI) : la clé vient de l'environnement.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
# Gratuit, en local avec Ollama (API compatible) : OPENAI_API_KEY=ollama,
# SPRING_AI_OPENAI_BASE_URL=http://localhost:11434 et SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=llama3.2
# (et SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL=nomic-embed-text pour les embeddings)
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.http.client.read-timeout=10s
