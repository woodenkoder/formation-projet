# Le déploiement de la Lanterne (écrit vite, un vendredi soir).
name: Déployer

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que l'image se construit
        run: docker build -t lanterne:test .
      - name: Publier
        run: |
          docker login ghcr.io -u nocturne -p ghp_JetonDeDemoEcritEnDur0123456789
          docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" .
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
      - name: Déployer
        run: deploy/deployer.sh "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
